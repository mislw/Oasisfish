# Open after two physical transient failures and make retries deterministic.
- id: llm-circuit-breaker
  name: '@deepseek-ai/dsh-llm-circuit-breaker'
  config:
    failureThreshold: 2
    openDurationMs: 30000
    failureCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    retryPolicy:
      mode: normal
      maxRetries: 2
      backoff:
        initialDelayMs: 1
        maxDelayMs: 1
        jitterRatio: 0
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.
