# Keyless replay composition: retain the real Oasisfish Skill/search/tool
# pipeline and replace only the conversation model with recorded replay.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: system-prompt
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: skill-search-local
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: skill-search-fixture
      name: './skill-search-fixture.mjs'
