# Keyless generated-image composition for the headless runnable snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: image-snapshot-backend
            name: './tests/fixtures/image-generation-snapshot-backend.mjs'
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                snapshot-image:
                  api: openai-completions
                  baseURL: !!js process.env.DSH_IMAGE_SNAPSHOT_BASE_URL
                  models:
                    - id: gpt-image-1
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: image-generation
            name: '@deepseek-ai/dsh-image-generation'
            config:
              provider: snapshot-image
              model: gpt-image-1
              endpointPath: images/generations
              editEndpointPath: images/edits
              maxResponseBytes: 1048576
          - id: tool-image-generate
            name: '@deepseek-ai/dsh-tool-image-generate'
            config:
              timeoutMs: 30000
