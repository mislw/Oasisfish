# Keyless two-turn native-memory composition for the headless Loader snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: memory-snapshot-backend
            name: './tests/fixtures/native-memory-snapshot-backend.mjs'
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: './.memory-storage'
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: memory
            name: '@deepseek-ai/dsh-memory'
          - id: memory-local
            name: '@deepseek-ai/dsh-memory-local'
            config:
              maxUserItems: 4
              maxProjectItems: 4
              maxItemChars: 200
              maxUserChars: 400
              maxProjectChars: 400
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
